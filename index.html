<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 교실 마피아</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f1ff;
  color: #29243d;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 24px;
}

h1 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 30px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(60, 40, 100, 0.08);
}

textarea {
  width: 100%;
  min-height: 220px;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #7657e8;
  color: white;
  margin: 5px;
}

button:hover {
  opacity: 0.85;
}

button.secondary {
  background: #e9e5f7;
  color: #4d4566;
}

button.danger {
  background: #e55353;
}

button.success {
  background: #3aaa72;
}

.hidden {
  display: none !important;
}

.role-settings {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 15px 0;
}

.role-settings label {
  background: #f6f4fc;
  padding: 12px;
  border-radius: 10px;
}

.role-settings input {
  width: 60px;
  padding: 7px;
  margin-left: 5px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.phase {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 15px;
}

.players {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}

.player {
  background: #f7f5fc;
  border: 2px solid transparent;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.player:hover {
  transform: translateY(-2px);
  border-color: #7657e8;
}

.player.dead {
  background: #eee;
  color: #999;
  text-decoration: line-through;
}

.player.selected {
  border-color: #7657e8;
  background: #eee8ff;
}

.name {
  font-weight: bold;
  font-size: 17px;
}

.status {
  font-size: 13px;
  margin-top: 5px;
}

.role-secret {
  margin-top: 8px;
  font-size: 14px;
  color: #7657e8;
}

.log {
  background: #29243d;
  color: white;
  border-radius: 12px;
  padding: 15px;
  max-height: 200px;
  overflow-y: auto;
  font-size: 14px;
}

.result {
  text-align: center;
  padding: 25px;
  border-radius: 15px;
  background: #fff6d9;
  font-size: 22px;
  font-weight: bold;
}

.info {
  background: #eef5ff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

@media (max-width: 600px) {
  .container {
    padding: 12px;
  }

  .role-settings {
    grid-template-columns: repeat(2, 1fr);
  }

  h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🎭 교실 마피아</h1>
<div class="subtitle">선생님을 위한 오프라인 마피아 게임 진행 도우미</div>

<!-- 시작 화면 -->
<div id="setupScreen">

  <div class="card">
    <h2>👥 학생 명단</h2>

    <div class="info">
      학생 이름을 한 줄에 한 명씩 입력해주세요.
    </div>

    <textarea id="studentInput"
      placeholder="김민수&#10;이서연&#10;박지훈&#10;최유진&#10;..."></textarea>

    <p>
      현재 인원: <strong><span id="studentCount">0</span>명</strong>
    </p>
  </div>

  <div class="card">
    <h2>🎲 역할 설정</h2>

    <div class="role-settings">
      <label>🔪 마피아
        <input id="mafiaCount" type="number" value="4" min="1">
      </label>

      <label>👮 경찰
        <input id="policeCount" type="number" value="3" min="0">
      </label>

      <label>🩺 의사
        <input id="doctorCount" type="number" value="2" min="0">
      </label>

      <label>📰 기자
        <input id="reporterCount" type="number" value="1" min="0">
      </label>
    </div>

    <p>
      나머지는 자동으로 시민이 됩니다.
    </p>

    <button onclick="startGame()">🎲 역할 랜덤 배정</button>
  </div>

</div>


<!-- 게임 화면 -->
<div id="gameScreen" class="hidden">

  <div class="card">

    <div id="phaseTitle" class="phase">
      🌙 밤 1
    </div>

    <div id="phaseDescription" class="info"></div>

    <div id="actionArea"></div>

  </div>


  <div class="card">

    <h2>👥 학생 현황</h2>

    <div id="players" class="players"></div>

  </div>


  <div class="card">

    <h2>📜 게임 기록</h2>

    <div id="log" class="log"></div>

  </div>

</div>

</div>


<script>

let players = [];
let night = 1;
let phase = "role";
let selectedPlayer = null;
let nightActions = {};

const roles = {
  mafia: "🔪 마피아",
  police: "👮 경찰",
  doctor: "🩺 의사",
  reporter: "📰 기자",
  citizen: "👤 시민"
};


// 학생 수 표시
document.getElementById("studentInput").addEventListener("input", updateCount);

function updateCount() {
  const names = document.getElementById("studentInput").value
    .split("\n")
    .map(x => x.trim())
    .filter(x => x);

  document.getElementById("studentCount").textContent = names.length;
}


// 게임 시작
function startGame() {

  const names = document.getElementById("studentInput").value
    .split("\n")
    .map(x => x.trim())
    .filter(x => x);

  if (names.length < 5) {
    alert("학생이 최소 5명은 필요합니다.");
    return;
  }

  const mafia = Number(document.getElementById("mafiaCount").value);
  const police = Number(document.getElementById("policeCount").value);
  const doctor = Number(document.getElementById("doctorCount").value);
  const reporter = Number(document.getElementById("reporterCount").value);

  const specialCount = mafia + police + doctor + reporter;

  if (specialCount > names.length) {
    alert("역할 수가 학생 수보다 많습니다.");
    return;
  }

  let roleList = [];

  for (let i = 0; i < mafia; i++) roleList.push("mafia");
  for (let i = 0; i < police; i++) roleList.push("police");
  for (let i = 0; i < doctor; i++) roleList.push("doctor");
  for (let i = 0; i < reporter; i++) roleList.push("reporter");

  while (roleList.length < names.length) {
    roleList.push("citizen");
  }

  shuffle(roleList);

  players = names.map((name, index) => ({
    id: index,
    name: name,
    role: roleList[index],
    alive: true
  }));

  document.getElementById("setupScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  log("🎲 역할 배정 완료!");
  log("교사는 학생들에게 몰래 역할을 알려주세요.");

  showRoleView();
}


// 배열 섞기
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];
  }
}


// 역할 확인 화면
function showRoleView() {

  phase = "role";

  document.getElementById("phaseTitle").textContent =
    "🎭 역할 확인";

  document.getElementById("phaseDescription").innerHTML =
    "학생을 클릭하면 역할을 확인할 수 있습니다.<br>" +
    "확인한 뒤 학생에게 조용히 알려주세요.";

  const area = document.getElementById("actionArea");

  area.innerHTML = `
    <div class="players">
      ${players.map(p => `
        <button onclick="showRole(${p.id})">
          ${p.name}
        </button>
      `).join("")}
    </div>

    <br>

    <button class="success" onclick="startNight()">
      🌙 역할 확인 완료 → 첫날 밤 시작
    </button>
  `;

  renderPlayers();
}


function showRole(id) {

  const p = players.find(x => x.id === id);

  alert(`${p.name}\n\n역할: ${roles[p.role]}`);
}


// 밤 시작
function startNight() {

  phase = "mafia";

  nightActions = {
    mafiaTarget: null,
    policeTarget: null,
    doctorTarget: null,
    reporterTarget: null
  };

  renderNightPhase();
}


function renderNightPhase() {

  let title = "";
  let description = "";
  let nextFunction = "";

  if (phase === "mafia") {

    title = `🌙 ${night}번째 밤 - 🔪 마피아`;

    description =
      "마피아가 죽일 학생을 선택하세요.<br>" +
      "마피아끼리 조용히 상의한 후 한 명을 클릭합니다.";

    nextFunction = "selectMafia";

  }

  else if (phase === "police") {

    title = `🌙 ${night}번째 밤 - 👮 경찰`;

    description =
      "경찰이 조사할 학생을 선택하세요.<br>" +
      "조사 결과는 화면에 표시됩니다.";

    nextFunction = "selectPolice";

  }

  else if (phase === "doctor") {

    title = `🌙 ${night}번째 밤 - 🩺 의사`;

    description =
      "의사가 살릴 학생을 선택하세요.";

    nextFunction = "selectDoctor";

  }

  else if (phase === "reporter") {

    title = `🌙 ${night}번째 밤 - 📰 기자`;

    description =
      "기자가 확인할 학생을 선택하세요.<br>" +
      "기자는 게임 중 한 번만 사용할 수 있습니다.";

    nextFunction = "selectReporter";

  }

  document.getElementById("phaseTitle").textContent = title;

  document.getElementById("phaseDescription").innerHTML =
    description;

  const alivePlayers = players.filter(p => p.alive);

  document.getElementById("actionArea").innerHTML = `
    <div class="players">
      ${alivePlayers.map(p => `
        <button onclick="${nextFunction}(${p.id})">
          ${p.name}
        </button>
      `).join("")}
    </div>
  `;

  renderPlayers();
}


// 마피아
function selectMafia(id) {

  nightActions.mafiaTarget = id;

  const p = players.find(x => x.id === id);

  log(`🔪 마피아 공격 대상: ${p.name}`);

  phase = "police";

  renderNightPhase();
}


// 경찰
function selectPolice(id) {

  nightActions.policeTarget = id;

  const p = players.find(x => x.id === id);

  alert(
    `${p.name}\n\n` +
    `직업: ${roles[p.role]}`
  );

  log(`👮 경찰이 ${p.name}을 조사했습니다.`);

  phase = "doctor";

  renderNightPhase();
}


// 의사
function selectDoctor(id) {

  nightActions.doctorTarget = id;

  const p = players.find(x => x.id === id);

  log(`🩺 의사 치료 대상: ${p.name}`);

  phase = "reporter";

  renderNightPhase();
}


// 기자
function selectReporter(id) {

  nightActions.reporterTarget = id;

  const p = players.find(x => x.id === id);

  alert(
    `${p.name}\n\n` +
    `직업: ${roles[p.role]}`
  );

  log(`📰 기자가 ${p.name}의 직업을 확인했습니다.`);

  finishNight();
}


// 밤 결과
function finishNight() {

  const targetId = nightActions.mafiaTarget;
  const doctorId = nightActions.doctorTarget;

  if (targetId === doctorId) {

    const saved = players.find(p => p.id === targetId);

    log(`🩺 의사가 ${saved.name}을 살렸습니다!`);

  } else {

    const victim = players.find(p => p.id === targetId);

    if (victim && victim.alive) {

      victim.alive = false;

      log(`💀 ${victim.name}이 마피아에게 습격당했습니다.`);

    }
  }

  renderPlayers();

  if (checkWin()) return;

  setTimeout(() => {

    startDay();

  }, 300);
}


// 낮 시작
function startDay() {

  phase = "day";

  document.getElementById("phaseTitle").textContent =
    `☀️ ${night}번째 날`;

  document.getElementById("phaseDescription").innerHTML =
    "학생들이 토론한 뒤, 탈락시킬 학생을 선택하세요.";

  const alivePlayers = players.filter(p => p.alive);

  document.getElementById("actionArea").innerHTML = `

    <div class="info">
      💬 토론 시간을 가진 후 투표를 진행하세요.
    </div>

    <div class="players">
      ${alivePlayers.map(p => `
        <button class="danger"
          onclick="vote(${p.id})">
          🗳️ ${p.name}
        </button>
      `).join("")}
    </div>

  `;

  renderPlayers();
}


// 투표
function vote(id) {

  const p = players.find(x => x.id === id);

  const confirmed = confirm(
    `${p.name}을(를) 탈락시키겠습니까?`
  );

  if (!confirmed) return;

  p.alive = false;

  log(`🗳️ 투표 결과: ${p.name} 탈락`);

  renderPlayers();

  if (checkWin()) return;

  night++;

  setTimeout(() => {

    startNight();

  }, 500);
}


// 승리 조건
function checkWin() {

  const aliveMafia = players.filter(
    p => p.alive && p.role === "mafia"
  ).length;

  const aliveOthers = players.filter(
    p => p.alive && p.role !== "mafia"
  ).length;

  if (aliveMafia === 0) {

    showGameOver("🎉 시민 진영 승리!", "마피아가 모두 탈락했습니다.");

    return true;

  }

  if (aliveMafia >= aliveOthers) {

    showGameOver("🔪 마피아 승리!", "마피아 수가 시민 진영과 같아졌습니다.");

    return true;

  }

  return false;
}


// 게임 종료
function showGameOver(title, message) {

  document.getElementById("phaseTitle").textContent =
    title;

  document.getElementById("phaseDescription").innerHTML = `
    <div class="result">
      ${message}
    </div>

    <br>

    <button onclick="showAllRoles()">
      👀 전체 역할 보기
    </button>

    <button class="secondary" onclick="location.reload()">
      🔄 새 게임
    </button>
  `;

  document.getElementById("actionArea").innerHTML = "";

  log(title);
}


// 전체 역할
function showAllRoles() {

  const result = players.map(p => {

    const status = p.alive ? "🟢 생존" : "🔴 사망";

    return `${p.name} — ${roles[p.role]} — ${status}`;

  }).join("\n");

  alert(result);
}


// 학생 목록
function renderPlayers() {

  const area = document.getElementById("players");

  area.innerHTML = players.map(p => {

    const status = p.alive ? "🟢 생존" : "🔴 사망";

    return `
      <div class="player ${p.alive ? "" : "dead"}">
        <div class="name">${p.name}</div>
        <div class="status">${status}</div>
      </div>
    `;

  }).join("");
}


// 기록
function log(message) {

  const area = document.getElementById("log");

  const time = new Date().toLocaleTimeString();

  area.innerHTML +=
    `<div>[${time}] ${message}</div>`;

  area.scrollTop = area.scrollHeight;
}

</script>

</body>
</html>
